# @toast-ui/vue-chart, @toast-ui/react-chart를 npm 승인 대기열에 올린다 (npm staged publishing).
# wrapper는 chart를 번들에 넣지 않는다. 의존하는 chart 버전이 npm에 공개된 뒤에 실행한다.
#
# npmjs.com 설정: 두 패키지 각각 Settings → Trusted Publisher
#   GitHub Actions / nhn / tui.chart / publish-wrapper.yml / Environment 비움
#   Allowed actions 체크 없음 (stage publish만 허용)
name: publish wrapper
on:
  workflow_dispatch:

# 같은 배포가 동시에 두 번 돌지 않게 한다
concurrency:
  group: publish-wrapper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing(OIDC)
    strategy:
      # 한 wrapper가 실패해도 다른 wrapper는 계속 진행한다
      fail-fast: false
      matrix:
        package:
          - vue-chart
          - react-chart
    env:
      PACKAGE_DIRECTORY: apps/${{ matrix.package }}
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
      - name: check package
        id: package
        run: |
          NAME=$(node -p "require('./${PACKAGE_DIRECTORY}/package.json').name")
          VERSION=$(node -p "require('./${PACKAGE_DIRECTORY}/package.json').version")
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # 재실행할 때 이미 공개된 wrapper는 실패시키지 않고 건너뛴다
          if [ -n "$(npm view "${NAME}@${VERSION}" version 2>/dev/null)" ]; then
            echo "::notice::${NAME}@${VERSION}은 이미 배포됐다. 이 패키지는 건너뛴다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Trusted Publishing은 repository.url이 이 저장소와 정확히 같아야 한다
          node -e '
            const pkg = require(`./${process.env.PACKAGE_DIRECTORY}/package.json`);
            const url = typeof pkg.repository === "string" ? pkg.repository : (pkg.repository || {}).url || "";
            const normalized = url.replace(/^git\+/, "").replace(/\.git$/, "");
            const expected = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
            if (normalized !== expected) {
              console.log(`::error::repository.url(${url})이 ${expected}와 다르다. provenance 검증에서 배포가 실패한다.`);
              process.exit(1);
            }
          '

          # stage publish는 latest 태그로 올린다. 프리릴리스 버전은 막는다.
          case "$VERSION" in
            *-*)
              echo "::error::프리릴리스 버전(${VERSION})은 latest로 배포하지 않는다."
              exit 1
              ;;
          esac

          echo "skip=false" >> "$GITHUB_OUTPUT"
      # 빌드는 Node 15에서만 된다
      - name: use Node.js (.nvmrc, build)
        if: steps.package.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: npm ci
        if: steps.package.outputs.skip != 'true'
        run: npm ci
      # wrapper lock이 가리키는 chart 버전이 npm에 없으면 여기서 notarget으로 실패한다
      - name: npm ci (wrapper)
        if: steps.package.outputs.skip != 'true'
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: npm ci
      - name: build
        if: steps.package.outputs.skip != 'true'
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: npm run build
      # staged publishing은 Node 22.14+와 npm 11.15.0+가 필요하다
      - name: use Node.js 24 (stage)
        if: steps.package.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: update npm
        if: steps.package.outputs.skip != 'true'
        run: npm install -g npm@^11.15.0
      - name: npm stage publish
        if: steps.package.outputs.skip != 'true'
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: npm stage publish
      - name: write summary
        if: steps.package.outputs.skip != 'true'
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          {
            echo "## ${NAME}@${VERSION} 승인 대기"
            echo ""
            echo "1. \`npm stage list ${NAME}\`로 stage-id를 확인한다."
            echo "2. \`npm stage download <stage-id>\`로 tarball을 받아 검증한다."
            echo "3. npmjs.com의 Staged Packages 탭 또는 \`npm stage approve <stage-id>\`로 승인한다. 2FA가 필요하다."
          } >> "$GITHUB_STEP_SUMMARY"
